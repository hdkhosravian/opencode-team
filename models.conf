# The DEFAULT models of the team: six roles, one line each.
#
# Format: ROLE=provider/model            (default reasoning level)
#         ROLE=provider/model#variant    (variant = reasoning level, e.g. high)
# Comment lines start with # at the beginning of the line. No comments after a value.
#
# To change a model yourself, you do not need this file:
#   - inside OpenCode:   /model developer openai/gpt-5.4-nano      /model claude-only      /model reset
#   - in a terminal:     python3 ~/.config/opencode/team/models.py          (interactive picker)
# Those choices go to ~/.config/opencode/team/models.local.conf and survive updates.
# Edit THIS file to change the defaults, then run `bash setup.sh` again. In this repository,
# `python3 tools/gen_v2.py` regenerates global/ and global-v2/ from it.
#
# Each provider you use needs its own key: run /connect inside OpenCode.
# Valid IDs: https://models.dev (or `opencode models`).
#
# Rule of thumb: keep REVIEWER in a different model family (provider) than DEVELOPER and
# DEVELOPER_STRONG, so the reviewer's blind spots do not overlap with the author's.

# lead: product, domain, architecture, epics. Talks least, so it can be the strongest model.
LEAD=anthropic/claude-opus-5-5#high
# tech-lead: default agent. Cards, acceptance tests, gate, task state. Also the default model.
TECH_LEAD=anthropic/claude-sonnet-5-5
# reviewer: read-only review of one change.
REVIEWER=anthropic/claude-sonnet-5-5
# developer: implements one card with TDD. Cheap model that follows precise cards.
DEVELOPER=google/gemini-3.8-flash#high
# developer-strong: T2 (risky) cards and cards the developer could not do.
DEVELOPER_STRONG=anthropic/claude-sonnet-5-5
# background: explore, general, title, compaction, summary, reporter (/status). Called often, keep it cheap.
BACKGROUND=google/gemini-3.8-flash
